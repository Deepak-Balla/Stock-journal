<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Journal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--text:#14171f;--muted:#667085;--border:#e3e6ec;--accent:#4f46e5;--accent-weak:#eceeff;--pos:#0d9455;--pos-bg:#e3f5ec;--neg:#d92d20;--neg-bg:#fdebe9;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--surface:#161b22;--surface2:#1d242e;--text:#e7eaf0;--muted:#8d95a5;--border:#262e3a;--accent:#8c8cff;--accent-weak:#222449;--pos:#3ddc97;--pos-bg:#10291f;--neg:#ff7b72;--neg-bg:#2d1618;--shadow:none}}
:root[data-theme=dark]{--bg:#0e1116;--surface:#161b22;--surface2:#1d242e;--text:#e7eaf0;--muted:#8d95a5;--border:#262e3a;--accent:#8c8cff;--accent-weak:#222449;--pos:#3ddc97;--pos-bg:#10291f;--neg:#ff7b72;--neg-bg:#2d1618;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 18px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.side a:hover{background:var(--surface2);color:var(--text)}
.side a.on{background:var(--accent-weak);color:var(--accent)}
.side .hint{margin-top:auto;font-size:12px;color:var(--muted);padding:10px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{padding:24px 28px 60px;max-width:1280px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.top h1{font-size:24px;margin:0}
.top .sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:16px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:2fr 1fr}
.g-2e{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#gate[hidden]{display:none}
.gate-card{width:min(420px,100%);padding:26px}
.gate-card .brand{padding:0 0 14px}
.gate-card h2{margin:6px 0 4px;font-size:22px}
.gate-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.gate-or::before,.gate-or::after{content:"";flex:1;height:1px;background:var(--border)}
.spin{width:24px;height:24px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:6px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.sync-st.pos{color:var(--pos)}.sync-st.neg{color:var(--neg)}
.wsub{color:var(--muted);font-size:12px;text-transform:none;font-weight:500;letter-spacing:0}
.lg{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.lg span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.prog{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.prog i.done{background:var(--pos)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hm .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.hm .hc{aspect-ratio:1/1;min-height:30px;border-radius:8px;border:1px solid transparent;background:var(--surface2);color:var(--muted);font-size:11px;padding:4px 5px;display:flex;align-items:flex-start;justify-content:flex-start}
.hm button.hc{cursor:pointer}
.hm button.hc:hover{filter:brightness(1.1)}
.hm .hc.void{background:transparent}
.hm .hc.today{border-color:var(--accent);font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .lbl{color:var(--muted);font-size:13px}
.tile .val{font-size:26px;font-weight:700;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile .meta{font-size:13px;color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface2);padding:3px;border-radius:10px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chart{position:relative;height:270px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.kv div b{font-size:16px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
.r{text-align:right}
.scroll{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--surface2);color:var(--muted)}
.tag.long{background:var(--pos-bg);color:var(--pos)}.tag.short{background:var(--neg-bg);color:var(--neg)}.tag.open{background:var(--accent-weak);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
input,select,textarea{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;width:100%}
.filters input,.filters select{width:auto;min-width:130px}
label.f{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
label.f small{color:var(--muted);font-weight:400}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fg .span2{grid-column:span 2}.fg .span3{grid-column:span 3}
dialog{border:1px solid var(--border);border-radius:18px;padding:0;background:var(--surface);color:var(--text);width:min(680px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,12,18,.55)}
.dlg-body{padding:22px}
.dlg-body h3{margin:0 0 14px;font-size:19px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.preview{display:flex;gap:22px;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:16px}
.preview span{display:block;font-size:12px;color:var(--muted)}.preview b{font-size:17px}
.sidebtn{display:flex;gap:0;background:var(--surface2);border-radius:10px;padding:3px}
.sidebtn label{flex:1;text-align:center;padding:7px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.sidebtn input{position:absolute;opacity:0;width:0}
.sidebtn input:checked+span{display:block;margin:-7px;padding:7px;border-radius:8px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.sidebtn input:focus-visible+span{outline:2px solid var(--accent)}
.check{display:flex;align-items:center;gap:8px;padding-top:28px}.check input{width:auto}
.err{color:var(--neg);font-size:13px;min-height:18px;margin-top:8px}
.cal-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-head h2{margin:0;font-size:20px;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.15fr;gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding:4px}
.cc{min-height:86px;border-radius:10px;padding:8px;background:var(--surface2);border:1px solid transparent;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:default;overflow:hidden}
.cc.empty{background:transparent}
.cc .d{font-size:12px;color:var(--muted)}
.cc .p{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cc .n{font-size:11px;color:var(--muted)}
button.cc{cursor:pointer;font:inherit;color:inherit}
.cc.pos{background:var(--pos-bg);color:var(--pos)}.cc.neg{background:var(--neg-bg);color:var(--neg)}
.cc.sel{border-color:var(--accent)}
.cc.today .d{color:var(--accent);font-weight:700}
.cc.wk{background:var(--surface);border:1px dashed var(--border)}
.bl{display:grid;grid-template-columns:110px 1fr 100px 30px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bl-bar{height:8px;background:var(--surface2);border-radius:9px;overflow:hidden}
.bl-bar i{display:block;height:100%;border-radius:9px}
.bl-k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bl-v{text-align:right;font-variant-numeric:tabular-nums}.bl-n{color:var(--muted);font-size:12px;text-align:right}
.fill-pos{background:var(--pos)}.fill-neg{background:var(--neg)}
.insight{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}.insight:last-child{border:0}
.insight .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.empty-state{text-align:center;padding:60px 20px;max-width:520px;margin:30px auto}
.empty-state h2{margin:12px 0 6px}.empty-state p{color:var(--muted)}
.empty-state .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.note{background:var(--accent-weak);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;display:none;gap:14px;align-items:center;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
.fab{display:none}
.sec{margin-top:26px}
.row-gap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (max-width:960px){.g-2,.g-2e{grid-template-columns:1fr}}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--border);z-index:20}
 .side .brand,.side .hint{display:none}
 .side a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
 main{padding:16px 16px 100px}
 .top .btn.primary span{display:none}
 .fg{grid-template-columns:1fr 1fr}.fg .span3{grid-column:span 2}
 .cc{min-height:62px;padding:5px}.cc .n{display:none}.cc .p{font-size:11px}
 .cal{gap:3px}
 .bl{grid-template-columns:80px 1fr 84px 24px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="nav"></aside>
 <main>
  <div class="top"><div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
   <div class="row-gap" style="flex-wrap:nowrap"><select id="gm" aria-label="Filter by market" style="width:auto"></select>
   <button class="btn primary" data-act="add" title="Shortcut: N"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add trade</span></button></div></div>
  <div id="view"></div>
 </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,e=document)=>e.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ICONS={
 dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 journal:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/>',
 reports:'<path d="M3 3v18h18"/><path d="M7 15v3M12 9v9M17 5v13"/>',
 capital:'<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><circle cx="16" cy="14" r="1"/>',
 settings:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'
};
const ico=n=>`<svg class="i" viewBox="0 0 24 24">${ICONS[n]}</svg>`;

/* ---------- state ---------- */
let KEY='stockJournal.v1';
const defIn=()=>/-IN$/i.test(navigator.language||'');
let S=load();
function load(){
 try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.trades)){
  const seen=new Map();d.trades.forEach(t=>{if(t.strategy){t.strategy=t.strategy.trim();const k=t.strategy.toLowerCase();if(!seen.has(k))seen.set(k,t.strategy);t.strategy=seen.get(k)}}); // merge case-variants
  return{trades:d.trades,cash:d.cash||[],settings:Object.assign({currency:defIn()?'₹':'$',startCapital:0,theme:'auto'},d.settings)}}}catch(e){}
 return{trades:[],cash:[],settings:{currency:defIn()?'₹':'$',startCapital:0,theme:'auto'}};
}
function save(){Cloud.push();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save – browser storage is blocked')}}
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t}

/* ---------- formatting ---------- */
const loc=()=>S.settings.currency==='₹'?'en-IN':'en-US';
const money=(n,signed=true)=>(n<0?'−':(signed&&n>0?'+':''))+S.settings.currency+new Intl.NumberFormat(loc(),{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(n));
const cmoney=n=>(n<0?'−':n>0?'+':'')+S.settings.currency+new Intl.NumberFormat(loc(),{notation:'compact',maximumFractionDigits:1}).format(Math.abs(n));
const pct=n=>n==null?'—':(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2)+'%';
const cls=n=>n>0?'pos':n<0?'neg':'';
const dfmt=s=>pd(s).toLocaleDateString('en',{day:'numeric',month:'short',year:'numeric'});
const plain=n=>new Intl.NumberFormat(loc(),{maximumFractionDigits:2}).format(n);

/* ---------- trade math ---------- */
const dir=t=>t.side==='Short'?-1:1;
const isClosed=t=>t.exit!=null;
const MARKETS={
 Stocks:{unit:'Shares',mult:1,ph:'e.g. RELIANCE'},
 ETFs:{unit:'Units',mult:1,ph:'e.g. NIFTYBEES'},
 Crypto:{unit:'Coins',mult:1,ph:'e.g. BTC/USDT'},
 Forex:{unit:'Lots',mult:100000,ph:'e.g. EUR/USD'},
 Futures:{unit:'Contracts',mult:1,ph:'e.g. NIFTY FUT'},
 Options:{unit:'Contracts',mult:1,ph:'e.g. NIFTY 24500 CE'},
 Commodities:{unit:'Lots',mult:1,ph:'e.g. GOLD'},
 Other:{unit:'Quantity',mult:1,ph:'Symbol'}
};
const mktOf=t=>t.market||'Stocks';
const mulOf=t=>t.mult>0?t.mult:1;
const value=t=>t.entry*t.qty*mulOf(t); // position size
const pnlOf=t=>isClosed(t)?(t.exit-t.entry)*t.qty*mulOf(t)*dir(t)-(t.fees||0):null;
const retOf=t=>isClosed(t)?pnlOf(t)/value(t)*100:null;
const rOf=t=>(isClosed(t)&&t.stop!=null&&t.stop!==t.entry)?pnlOf(t)/(Math.abs(t.entry-t.stop)*t.qty*mulOf(t)):null;
const uniqCI=a=>{const m=new Map();a.filter(Boolean).forEach(x=>{const k=x.trim().toLowerCase();if(k&&!m.has(k))m.set(k,x.trim())});return[...m.values()]};
const canonName=(v,list)=>{v=(v||'').trim();const k=v.toLowerCase();return list.find(x=>x&&x.trim().toLowerCase()===k)||v};
const sortT=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);
const closedTrades=()=>S.trades.filter(isClosed).sort(sortT);
const G={market:''}; // global market filter
const inMkt=t=>!G.market||mktOf(t)===G.market;
const scoped=()=>closedTrades().filter(inMkt);

function capitalAt(date){ // money in the account at the start of `date`
 let c=+S.settings.startCapital||0;
 S.cash.forEach(x=>{if(x.date<=date)c+=x.amount});
 closedTrades().forEach(t=>{if(t.date<date)c+=pnlOf(t)});
 return c;
}
const totalIn=()=>(+S.settings.startCapital||0)+sum(S.cash.filter(x=>x.amount>0).map(x=>x.amount));
const retPct=(pnl,start)=>{let b=capitalAt(start);
 if(b<=0){const f=closedTrades().find(t=>t.date>=start);if(f)b=capitalAt(f.date)} // period began before capital was added
 return b>0?pnl/b*100:null};
const pStart=k=>k.length===4?k+'-01-01':k.length===7?k+'-01':k;

function groupBy(list,kf){
 const m=new Map();
 list.forEach(t=>{const k=kf(t);let g=m.get(k);if(!g){g={key:k,pnl:0,n:0,w:0,l:0,trades:[]};m.set(k,g)}const p=pnlOf(t);g.pnl+=p;g.n++;if(p>0)g.w++;else if(p<0)g.l++;g.trades.push(t)});
 return[...m.values()].sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0);
}
function stats(list){
 const p=list.map(pnlOf),n=list.length;
 const wins=p.filter(x=>x>0),loss=p.filter(x=>x<0),gw=sum(wins),gl=sum(loss);
 const days=groupBy(list,t=>t.date);
 let cum=0,peak=0,dd=0;days.forEach(d=>{cum+=d.pnl;peak=Math.max(peak,cum);dd=Math.max(dd,peak-cum)});
 let ws=0,bw=0,ls=0,bl=0;
 list.forEach(t=>{const x=pnlOf(t);if(x>0){ws++;ls=0;bw=Math.max(bw,ws)}else if(x<0){ls++;ws=0;bl=Math.max(bl,ls)}else{ws=0;ls=0}});
 const Rs=list.map(rOf).filter(x=>x!=null);
 return{n,pnl:gw+gl,wins:wins.length,losses:loss.length,winRate:n?wins.length/n*100:0,avgWin:wins.length?gw/wins.length:0,avgLoss:loss.length?gl/loss.length:0,

function tradeTable(list,compact){

 return `<div class="scroll"><table><thead><tr><th>Date</th><th>Symbol</th>${compact?'':'<th>Side</th><th class="r">Qty</th><th class="r">Entry</th><th class="r">Exit</th>'}<th class="r">P&amp;L</th><th class="r">Return</th>${compact?'':'<th>Strategy</th><th>Mood</th><th></th>'}</tr></thead><tbody>
 ${list.map(t=>{const p=pnlOf(t);return `<tr class="click" data-act="edit" data-id="${t.id}"><td class="num">${dfmt(t.date)}</td><td><b>${esc(t.symbol)}</b>${mktOf(t)!=='Stocks'?` <span class="tag">${mktOf(t)}</span>`:''}${compact?` <span class="tag ${t.side==='Short'?'short':'long'}">${t.side}</span>`:''}</td>
 ${compact?'':`<td><span class="tag ${t.side==='Short'?'short':'long'}">${t.side}</span></td><td class="r num">${plain(t.qty)}</td><td class="r num">${plain(t.entry)}</td><td class="r num">${isClosed(t)?plain(t.exit):'<span class="tag open">Open</span>'}</td>`}
 <td class="r num ${cls(p)}"><b>${p==null?(compact?'Open':'—'):money(p)}</b></td><td class="r num ${cls(p)}">${pct(retOf(t))}</td>
 ${compact?'':`<td>${esc(t.strategy)||'<span class="muted">—</span>'}${t.plan===false?' <span class="tag" title="Did not follow plan">off-plan</span>':''}</td><td>${esc(t.emotion)||'<span class="muted">—</span>'}</td><td class="r"><button class="btn sm ghost" data-act="del" data-id="${t.id}" title="Delete" aria-label="Delete trade"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td>`}</tr>`}).join('')}</tbody></table></div>`;
}

  <input id="fq" type="search" placeholder="Search symbol, notes…" value="${esc(J.q)}" aria-label="Search">
  <select id="fm" aria-label="Month"><option value="">All months</option>${months.map(m=>`<option value="${m}" ${J.month===m?'selected':''}>${pd(m+'-01').toLocaleDateString('en',{month:'long',year:'numeric'})}</option>`).join('')}</select>
  <select id="fs" aria-label="Side"><option value="">Long &amp; short</option><option ${J.side==='Long'?'selected':''}>Long</option><option ${J.side==='Short'?'selected':''}>Short</option></select>

}
function filteredTrades(){
 const q=J.q.toLowerCase();
 return S.trades.filter(t=>inMkt(t)&&(!q||(t.symbol+' '+t.notes+' '+t.strategy).toLowerCase().includes(q))&&(!J.side||t.side===J.side)&&(!J.strat||t.strategy===J.strat)&&(!J.month||t.date.startsWith(J.month))&&
  (!J.res||(J.res==='open'?!isClosed(t):J.res==='win'?pnlOf(t)>0:pnlOf(t)<0))).sort(sortT).reverse();
}
function paintJournal(){
 const el=$('#jt');if(!el)return;const l=filteredTrades();const s=stats(l.filter(isClosed));
 el.innerHTML=`<p class="muted" style="margin:0 0 8px">${l.length} trades · net <b class="${cls(s.pnl)}">${money(s.pnl)}</b> · win rate ${s.winRate.toFixed(0)}%</p>`+tradeTable(l,false);
}

function viewCalendar(){
 if(!S.trades.length)return emptyState();
 const{y,m}=C,first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),weeks=Math.ceil((off+dim)/7);
 const byDay=new Map(groupBy(scoped(),t=>t.date).map(g=>[g.key,g]));
 const today=ymd(new Date()),mk=`${y}-${pad(m+1)}`;
 const mg=[...byDay.values()].filter(g=>g.key.startsWith(mk)),ms=stats(mg.flatMap(g=>g.trades));
 let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Week'].map(d=>`<div class="dow">${d}</div>`).join('');
 for(let w=0;w<weeks;w++){let wp=0,wn=0;
  for(let i=0;i<7;i++){const dn=w*7+i-off+1;
   if(dn<1||dn>dim){h+='<div class="cc empty"></div>';continue}
   const key=`${mk}-${pad(dn)}`,g=byDay.get(key);if(g){wp+=g.pnl;wn+=g.n}
   h+=g?`<button class="cc ${g.pnl>=0?'pos':'neg'} ${C.sel===key?'sel':''} ${key===today?'today':''}" data-act="day" data-v="${key}" aria-label="${dfmt(key)}: ${money(g.pnl)}"><span class="d">${dn}</span><span class="p">${cmoney(g.pnl)}</span><span class="n">${g.n} trade${g.n>1?'s':''}</span></button>`
    :`<button class="cc ${C.sel===key?'sel':''} ${key===today?'today':''}" data-act="day" data-v="${key}" aria-label="${dfmt(key)}"><span class="d">${dn}</span></button>`}
  h+=`<div class="cc wk"><span class="d">Week ${w+1}</span><span class="p ${cls(wp)}">${wn?cmoney(wp):'—'}</span><span class="n">${wn?wn+' trades':''}</span></div>`}
 const sel=C.sel&&C.sel.startsWith(mk)?C.sel:null,dayT=sel?S.trades.filter(t=>t.date===sel&&inMkt(t)).sort(sortT):[];
 return `<div class="cal-head"><button class="btn" data-act="calnav" data-v="-1" aria-label="Previous month">‹</button><h2>${first.toLocaleDateString('en',{month:'long',year:'numeric'})}</h2><button class="btn" data-act="calnav" data-v="1" aria-label="Next month">›</button><button class="btn ghost" data-act="caltoday">Today</button>
  <span style="margin-left:auto" class="muted">Month: <b class="${cls(ms.pnl)}">${money(ms.pnl)}</b> · ${mg.length} trading days · ${ms.n?ms.winRate.toFixed(0)+'% win rate':'no trades'}${mg.length?` · avg ${money(ms.pnl/mg.length)}/day`:''}</span></div>
  <div class="cal">${h}</div>
  ${sel?`<div class="card sec"><h3>${dfmt(sel)} <button class="btn sm primary" data-act="add" data-v="${sel}">Add trade on this day</button></h3>${dayT.length?tradeTable(dayT,false):'<p class="muted">No trades on this day.</p>'}</div>`:'<p class="muted sec">Click a day to see its trades or add one.</p>'}`;
}

function viewReports(){
 if(!S.trades.length)return emptyState();
 const all=scoped(),lvl=R.tab==='day'?10:R.tab==='month'?7:4;
 const rows=groupBy(all,t=>t.date.slice(0,lvl)).reverse();
 const label=k=>R.tab==='day'?dfmt(k):R.tab==='month'?pd(k+'-01').toLocaleDateString('en',{month:'long',year:'numeric'}):k;
 const tbl=`<div class="scroll" style="max-height:480px;overflow-y:auto"><table><thead><tr><th>${R.tab==='day'?'Day':R.tab==='month'?'Month':'Year'}</th><th class="r">Trades</th><th class="r">Win rate</th><th class="r">Net P&amp;L</th><th class="r">Return</th><th class="r">Avg / trade</th><th class="r">Best</th><th class="r">Worst</th></tr></thead><tbody>
 ${rows.map(g=>{const ps=g.trades.map(pnlOf);return `<tr><td>${label(g.key)}</td><td class="r">${g.n}</td><td class="r">${Math.round(g.w/g.n*100)}%</td><td class="r num ${cls(g.pnl)}"><b>${money(g.pnl)}</b></td><td class="r num ${cls(g.pnl)}">${pct(retPct(g.pnl,pStart(g.key)))}</td><td class="r num ${cls(g.pnl)}">${money(g.pnl/g.n)}</td><td class="r num pos">${money(Math.max(...ps))}</td><td class="r num neg">${money(Math.min(...ps))}</td></tr>`}).join('')}</tbody></table></div>`;
 const by=(f,min)=>groupBy(all,f).filter(g=>g.key&&g.key!=='undefined').sort((a,b)=>b.pnl-a.pnl);
 return `<div class="card"><h3>Profit &amp; loss statement ${seg('rtab',R.tab,[['day','Daily'],['month','Monthly'],['year','Yearly']])}</h3>${tbl}</div>
 <p class="muted sec" style="margin-bottom:0">Breakdowns – bar = net P&amp;L, number at the right = trades</p>

  <div class="card"><h3>By emotion</h3>${barList(by(t=>t.emotion||''))}</div>
  <div class="card"><h3>Followed plan?</h3>${barList(groupBy(all,t=>t.plan?'Followed plan':'Off plan').sort((a,b)=>a.key<b.key?1:-1))}</div>
  <div class="card"><h3>Long vs short</h3>${barList(groupBy(all,t=>t.side))}</div>
 </div>`;
}

function loadSample(){

 const syms=inr?[['RELIANCE',2900],['TCS',4100],['INFY',1700],['HDFCBANK',1650],['SBIN',820],['ITC',470],['TATAMOTORS',950],['BAJFINANCE',7200]]:[['AAPL',225],['MSFT',430],['NVDA',140],['TSLA',260],['AMZN',200],['AMD',160],['META',590],['SPY',590]];

 S.cash.push({id:uid(),date:first,amount:inr?500000:10000,note:'Sample starting deposit',sample:true});

const Cloud=(()=>{
 const cfg=window.FIREBASE_CONFIG||{},configured=!!(cfg.apiKey&&cfg.projectId),enabled=configured&&!!window.firebase;

 const setPayload=()=>{const r=Object.assign({},S.settings);delete r.theme;return clean(r)}; // theme stays a per-device choice

 /* ----- push local changes (diff against what the server last told us) ----- */
 function push(){
  try{localStorage.setItem('stockJournal.theme',S.settings.theme||'auto')}catch(e){}
  if(!enabled||!user||!ready)return;
  const ops=[];
  COLS.forEach(c=>{
   S[c].forEach(x=>{if(!x.id)x.id=uid()});
   const cur=new Map(S[c].map(x=>[x.id,x]));
   cur.forEach((x,id)=>{const d=clean(x),j=sk(d);if(known[c].get(id)!==j){ops.push({c,id,data:d});known[c].set(id,j)}});
   [...known[c].keys()].forEach(id=>{if(!cur.has(id)){ops.push({c,id,del:true});known[c].delete(id)}});
  });
  const sp=setPayload(),sj=sk(sp);if(known.settings!==sj){ops.push({c:'meta',id:'settings',data:sp});known.settings=sj}

  const base=db.collection('users').doc(user.uid),jobs=[];
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(o=>{const r=base.collection(o.c).doc(o.id);o.del?b.delete(r):b.set(r,o.data)});jobs.push(b.commit())}

 /* ----- receive remote changes ----- */
 function listen(){
  const base=db.collection('users').doc(user.uid),seen={};let waiting=3;
  const first=k=>{if(!seen[k]){seen[k]=1;if(--waiting===0)onReady();return true}return false};
  const live=snap=>{if(ready&&!snap.metadata.hasPendingWrites&&!snap.metadata.fromCache&&navigator.onLine)setStatus('synced')};
  const fail=e=>{setStatus('error');if(!ready)showGate('error',e&&e.code==='permission-denied'?"Your Firebase security rules are blocking access. Publish the rules from firestore.rules (see SETUP.md).":"Couldn't reach your journal ("+((e&&(e.code||e.message))||'error')+').')};
  COLS.forEach(c=>unsubs.push(base.collection(c).onSnapshot(snap=>{
   const old=new Map(S[c].map(x=>[x.id,x])),m=new Map(),arr=[];
   snap.docs.forEach(d=>{const n=d.data();n.id=d.id;const j=sk(clean(n));m.set(d.id,j);const o=old.get(d.id);
    if(o&&known[c].get(d.id)===j)arr.push(o); // unchanged: keep the same object (an open edit dialog may hold it)
    else if(o){Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,n);arr.push(o)}

   const changed=!sameMap(m,known[c]);known[c]=m;S[c]=arr;live(snap);

   if(snap.exists){const th=S.settings.theme;Object.assign(S.settings,snap.data());S.settings.theme=th;known.settings=sk(setPayload())}
   else if(snap.metadata.fromCache)known.settings=before; // offline & unknown: never overwrite the cloud with defaults
   else known.settings=null; // server confirms there is none yet: our defaults get saved
   live(snap);
   if(!first('meta')&&sk(setPayload())!==before){applyTheme();render()}
  },fail));

  <div class="gate-or">or</div>
  <button type="button" class="btn" data-g="google" style="width:100%;justify-content:center">Continue with Google</button>
  ${up?'':'<p style="text-align:center;margin:14px 0 0"><button type="button" class="btn ghost sm" data-g="forgot">Forgot password?</button></p>'}
  ${location.protocol==='file:'?'<p class="muted" style="font-size:12px;margin:14px 0 0">You are opening this as a local file. Email sign-in works, but Google sign-in and using the journal on other devices need the hosted version – see SETUP.md.</p>':''}</div>`}
 function showGate(kind,msg){
  if(!gate)mkGate();clearTimeout(slowT);gate.hidden=false;$('.app').inert=true;
  if(kind==='auth'){gate.innerHTML=authHtml('','');focusEmail();return}
  gate.innerHTML=`<div class="card gate-card" style="text-align:center">${logo}${kind==='error'?'':'<div class="spin" role="status" aria-label="Loading"></div>'}<b>${esc(msg)}</b><p class="muted" id="g-slow" style="margin:8px 0 0;font-size:13px"></p>${kind==='error'?'<p style="margin:14px 0 0"><button class="btn primary" data-g="retry">Try again</button></p>':''}</div>`;
  if(kind!=='error')slowT=setTimeout(()=>{const s=$('#g-slow',gate);if(s)s.textContent=navigator.onLine?'Taking longer than usual…':"You're offline. Connect to the internet to open your journal."},9000);
 }
 function hideGate(){if(gate)gate.hidden=true;$('.app').inert=false;clearTimeout(slowT)}
 async function signIn(){
  const em=$('#g-email',gate).value.trim(),pw=$('#g-pass',gate).value;
  if(!em||!pw)return gmsg('Enter your email and password.');
  gmsg('');busy(true);
  try{if(gmode==='up'){const c=await auth.createUserWithEmailAndPassword(em,pw);c.user.sendEmailVerification().catch(()=>{})}else await auth.signInWithEmailAndPassword(em,pw)}catch(x){gmsg(ERR(x))}
  busy(false);
 }
 async function google(){gmsg('');try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(x){gmsg(ERR(x))}}
 async function forgot(em){
  if(!em.trim())return gmsg('Type your email above, then press "Forgot password?".');
  try{await auth.sendPasswordResetEmail(em.trim());gmsg('If an account exists for that email, a reset link is on its way.',true)}catch(x){gmsg(ERR(x))}
 }

 /* ----- sign out (wipes the local copy – important on shared computers) ----- */
 async function signOut(){
  const synced=await Promise.race([db.waitForPendingWrites().then(()=>true),new Promise(r=>setTimeout(()=>r(false),2500))]);
  if(!synced&&!await ask('Sign out with unsynced changes?',"Some recent changes haven't reached the cloud yet (you may be offline). Signing out now will discard them.",'Sign out anyway'))return;
  unsubs.forEach(f=>f());unsubs=[];ready=false;
  try{localStorage.removeItem(KEY)}catch(e){}
  try{await auth.signOut();await db.terminate();await db.clearPersistence()}catch(e){}
  location.hash='';location.reload();
 }
 document.addEventListener('click',e=>{const b=e.target.closest('[data-cloud]');if(!b||!enabled||!user)return;const a=b.dataset.cloud;
  if(a==='signout')signOut();
  if(a==='reset')auth.sendPasswordResetEmail(user.email).then(()=>toast('Password reset email sent')).catch(x=>toast(ERR(x)||'Could not send the email'));
 });

 /* ----- start-up ----- */
 function start(){
  KEY='stockJournal.cloud.'+user.uid;ready=false;known={trades:new Map(),cash:new Map(),settings:undefined};
  S={trades:[],cash:[],settings:{currency:defIn()?'₹':'$',startCapital:0,theme:savedTheme()}};
  applyTheme();setStatus('loading');showGate('sync','Opening your journal…');listen();
 }
 function boot(){
  if(!enabled){render();if(configured)toast("Couldn't load the sign-in library – working offline on this device only");return}
  showGate('sync','Loading…');
  firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  auth.onAuthStateChanged(u=>{
   if(u){if(user&&user.uid===u.uid)return;user=u;start()}
   else{user=null;ready=false;unsubs.forEach(f=>f());unsubs=[];showGate('auth')}
  });
 }

 /* ----- bits of UI used by the main views ----- */
 const who=()=>user?(user.email||user.displayName||'Signed in'):'';
 return{
  get on(){return enabled&&!!user&&ready},
  boot,push,
  hint:()=>enabled&&user?`<div class="hint"><b style="display:block;overflow:hidden;text-overflow:ellipsis;color:var(--text)" title="${esc(who())}">${esc(who())}</b><span class="sync-st">${LBL[status]}</span><br><button class="btn ghost sm" data-cloud="signout" style="padding:2px 0;margin:2px 0 6px">Sign out</button><br>Press <b>N</b> to add a trade.</div>`:HINT0,
  dataNote:()=>enabled&&user?'Your journal is saved to your account and syncs between your devices. A backup file is still a good idea.':'Everything is stored only in this browser. Export a backup regularly.',
  accountCard:()=>enabled&&user
   ?`<div class="card sec"><h3>Account</h3><div class="row-gap" style="justify-content:space-between"><div style="min-width:0"><b>${esc(who())}</b><div class="muted" style="font-size:13px"><span class="sync-st ${status==='synced'?'pos':status==='error'?'neg':''}">${LBL[status]}</span> · saved to your account and available on every device you sign in on</div></div><div class="row-gap">${(user.providerData||[]).some(p=>p.providerId==='password')?'<button class="btn" data-cloud="reset">Send password reset email</button>':''}<button class="btn" data-cloud="signout">Sign out</button></div></div></div>`
   :`<div class="card sec"><h3>Cloud sync</h3><p class="muted" style="margin:0">${configured?"The sign-in library couldn't be loaded, so the journal is working on this device only.":'Not set up – your journal is stored only in this browser. To add personal logins and sync across devices, follow <b>SETUP.md</b> (it takes about 10 minutes) and fill in <b>firebase-config.js</b>.'}</p></div>`
 };
})();
applyTheme();Cloud.boot();
</script>
</body>
</html>
